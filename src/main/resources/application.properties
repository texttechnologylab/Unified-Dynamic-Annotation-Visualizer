# Freemarker Properties
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl
# LLM API Configuration
app.llm.base-url=${LLM_BASE_URL:}
app.llm.api-token=${LLM_API_TOKEN:}
# Application Input Configuration
app.input-dir=${APP_INPUT_DIR:src/main/resources/input}
# Database Configuration
app.database-generator.enabled=true
# The MongoDB driver arrives transitively with DUUI and is not used; without this exclusion Spring
# Boot creates a client that keeps trying to reach localhost:27017 and logs stack traces.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
spring.profiles.active=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
#spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.show-sql=true
spring.sql.init.mode=never
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
logging.level.org.hibernate.SQL=INFO
#spring.batch.jdbc.initialize-schema=always

app.source-builder.enabled=${SROUCE_BUILDER:false}
app.pipeline-json-import.enabled=${PIPELINE_IMPORTER:true}
app.pipeline-json-import.folder=${PIPELINE_IMPORTER_FOLDER:src/main/resources/pipelines}
app.pipeline-json-import.replace-if-different=${PIPELINE_IMPORTER_REPLACE_IF_DIFFERENT:false}

app.json-data-import.enabled=${JSON_IMPORTER:true}
app.json-data-import.folder=${JSON_IMPORTER_FOLDER:src/main/resources/sourcefilesJSON}
app.json-data-import.replace-if-different=${JSON_IMPORTER_REPLACE_IF_DIFFERENT:false}

# --- DB settings used by DUUIImporter -> JooqDatabaseWriter ---
duui.importer.enabled=${DUUI_IMPORTER:false}
duui.importer.input-path=${DUUI_IMPORTER_PATH:src/main/resources/input}
duui.importer.input-file-ending=${DUUI_IMPORTER_FILE_ENDING:.xmi}
duui.importer.type-system-path=${DUUI_IMPORTER_TYPE_SYSTEM_PATH:src/main/resources/types/PlenumTypeSystem.xml}
duui.importer.workers=${DUUI_IMPORTER_WORKERS:4}
duui.importer.cas-pool-size=${DUUI_IMPORTER_CAS_POOL_SIZE:8}
app.db.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
app.db.user=${DB_USER:postgres}
app.db.pass=${DB_PASS:postgres}
app.db.schema=${DB_SCHEMA:public}
app.db.batch-size=${DB_BATCH_SIZE:3000}
app.db.max-ident=${DB_MAX_IDENT:255}
app.db.dialect=${DB_DIALECT:POSTGRES}
spring.datasource.hikari.connectionInitSql=SET search_path TO ${DB_SCHEMA:public}

# Optional: a bit of useful logging
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.jooq=WARN
logging.level.org.jooq.tools.LoggerListener=WARN
logging.level.org.hibernate=WARN
logging.level.org.postgresql=WARN
# Reduce verbose logs from specific packages
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.level.org.texttechnologylab.udav.importer.JooqDatabaseWriter=ERROR
spring.config.import=optional:file:.env[.properties]

# Kubernetes probe endpoints
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.pipeline-reset.enabled=${PIPELINE_RESET_ENABLED:false}
app.pipeline-reset.cron=${PIPELINE_RESET_CRON:0 0 2 * * *}
app.pipeline-reset.demo-file=${PIPELINE_RESET_DEMO_FILE:pipelines/demo.json}

# --- Headless batch export API (/api/batch) ---
# The headless page calls back into this same application for /api/data and /api/convertions/*,
# so pool size and concurrency feed back into the servlet container. Chromium caps connections per
# origin at ~6, bounding batch-attributable workers at roughly
# (max-sessions + max-waiters) + 6 * max-sessions. Keep that under server.tomcat.threads.max.
app.export.base-url=${UDAV_BASE_URL:http://localhost:8080}
app.export.concurrency=${EXPORT_CONCURRENCY:4}
app.export.widget-timeout-ms=${EXPORT_WIDGET_TIMEOUT_MS:30000}
app.export.ready-timeout-ms=${EXPORT_READY_TIMEOUT_MS:30000}
app.export.viewport-width=${EXPORT_VIEWPORT_WIDTH:1600}
app.export.viewport-height=${EXPORT_VIEWPORT_HEIGHT:1000}
app.export.pool.max-sessions=${EXPORT_POOL_MAX_SESSIONS:2}
app.export.pool.max-waiters=${EXPORT_POOL_MAX_WAITERS:8}
app.export.pool.borrow-timeout-ms=${EXPORT_POOL_BORROW_TIMEOUT_MS:120000}
app.export.pool.idle-timeout-ms=${EXPORT_POOL_IDLE_TIMEOUT_MS:300000}
# Chromium's sandbox is a real security control; enabling --no-sandbox is a deployment decision.
app.export.browser.no-sandbox=${EXPORT_NO_SANDBOX:false}
app.export.browser.disable-gpu=${EXPORT_DISABLE_GPU:true}
# Per-request measurements: a block in the log and the X-UDAV-Export-Metrics response header. Off
# by default; the evaluation harness (tools/run-evaluation.sh) needs them on.
app.export.metrics.enabled=${EXPORT_METRICS:false}
app.export.metrics.cpu-sample-interval-ms=${EXPORT_CPU_SAMPLE_MS:250}

# Short-TTL cache for pipeline JSON. One export reads the same pipeline 2 + 2W times.
app.pipeline-cache.ttl-ms=${PIPELINE_CACHE_TTL_MS:5000}

# Pinned because the batch export budget above is expressed against it.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
